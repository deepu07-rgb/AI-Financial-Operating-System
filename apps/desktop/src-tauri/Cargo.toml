[package]
name = "aifos-desktop"
version = "0.1.0"
description = "AIFOS offline-first Windows desktop shell"
authors = ["AIFOS project contributors"]
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "aifos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
aifos-backup = { path = "../../../packages/backup" }
aifos-connector-sdk = { path = "../../../packages/connector-sdk" }
aifos-document-store = { path = "../../../packages/document-store" }
aifos-document-worker-client = { path = "../../../packages/document-worker-client" }
aifos-domain = { path = "../../../packages/domain" }
aifos-storage = { path = "../../../packages/storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
reqwest = { version = "=0.13.4", default-features = false }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = { version = "=2.7.2", default-features = false }
tauri-plugin-updater = { version = "=2.10.1", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
