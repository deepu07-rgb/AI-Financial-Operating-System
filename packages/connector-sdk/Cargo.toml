[package]
name = "aifos-connector-sdk"
version = "0.1.0"
description = "Versioned offline connector contracts and CSV/Tally file adapters for AIFOS"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
aifos-domain = { path = "../domain" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.19"
