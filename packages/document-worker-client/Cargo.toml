[package]
name = "aifos-document-worker-client"
version = "0.1.0"
description = "Bounded process and protocol client for the AIFOS Python document worker"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
aifos-domain = { path = "../domain" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
