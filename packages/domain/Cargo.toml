[package]
name = "aifos-domain"
version = "0.1.0"
description = "Deterministic domain types and entities for AIFOS"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.19"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "=1.0.151"
