[package]
name = "aifos-document-store"
version = "0.1.0"
description = "Managed, content-hashed source document storage for AIFOS"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
aifos-domain = { path = "../domain" }
aifos-storage = { path = "../storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "=2.0.19"

[dev-dependencies]
uuid = { version = "=1.24.0", features = ["v4"] }
